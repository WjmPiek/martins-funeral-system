{% extends "base.html" %}
{% block auth_content %}
<section class="card narrow martins-login-card">
    <div class="martins-login-header">
        <strong>Martins Login</strong>
        <span>Funeral System</span>
    </div>
    <div class="martins-auth-brand">
        <img class="login-logo" src="{{ url_for('static', filename='img/logo.png') }}" alt="Martins logo">
        <strong>Martins System</strong>
        <span>Funeral System</span>
    </div>
    <div class="martins-login-body">
    <h1>Login</h1>
    <form method="post">
        <label>Email address</label>
        <input type="email" name="email" required>

        <label>Password</label>
        <input type="password" name="password" required>

        <button type="submit">Login</button>
    </form>
    <p><a href="{{ url_for('auth.forgot_password') }}">Forgot password?</a></p>
    <p>No account yet? <a href="{{ url_for('auth.register') }}">Register here</a></p>
    </div>
</section>
{% endblock %}
